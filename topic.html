<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="A hands-on machine learning lesson with a clear explanation, runnable Python example, sample dataset, and visual guide.">
  <title>ML lesson — ML Field Guide</title>
  <style>
    :root {
      color-scheme: light;
      --paper:#f5f4ef; --white:#fffefa; --ink:#202a28; --muted:#68736e;
      --line:#dedfd6; --green:#376b56; --green-dark:#244b3b; --green-pale:#e6eee7;
      --amber-pale:#f5ecde; --shadow:0 12px 35px rgba(32,42,40,.06);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.65 "Segoe UI","Helvetica Neue",sans-serif; }
    button,a { font:inherit; }
    a { color:inherit; }
    .wrap { width:min(1060px,calc(100% - 40px)); margin:0 auto; }
    .topbar { padding:18px 0; border-bottom:1px solid var(--line); }
    .topbar-inner { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; font-size:13px; font-weight:750; letter-spacing:.03em; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:var(--green); color:white; }
    .back-link { color:var(--green-dark); font-size:12px; font-weight:700; text-decoration:none; }
    .back-link:hover { text-decoration:underline; }
    .lesson-hero { padding:48px 0 30px; }
    .eyebrow { color:var(--green); font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:clamp(34px,5vw,52px); line-height:1.08; letter-spacing:-.05em; }
    .lead { max-width:790px; margin:0; color:var(--muted); font-size:16px; }
    .badges { display:flex; flex-wrap:wrap; gap:7px; margin-top:17px; }
    .badge { padding:5px 9px; border:1px solid var(--line); border-radius:99px; background:var(--white); color:#59655f; font-size:10px; font-weight:650; }
    .lesson-grid { display:grid; grid-template-columns:205px minmax(0,1fr); align-items:start; gap:25px; padding:16px 0 55px; }
    .toc { position:sticky; top:16px; padding:15px; border:1px solid var(--line); border-radius:12px; background:var(--white); }
    .toc strong { display:block; margin-bottom:8px; font-size:11px; }
    .toc a { display:block; padding:6px 0; color:var(--muted); font-size:11px; text-decoration:none; }
    .toc a:hover { color:var(--green-dark); }
    .content { min-width:0; }
    .lesson-section { margin-bottom:15px; padding:22px; border:1px solid var(--line); border-radius:13px; background:var(--white); }
    .lesson-section h2 { margin:0 0 10px; font-size:19px; line-height:1.25; letter-spacing:-.025em; }
    .lesson-section p { margin:0 0 10px; color:var(--muted); font-size:13px; }
    .lesson-section p:last-child { margin-bottom:0; }
    .when-note { padding:13px; border-radius:9px; background:var(--green-pale); color:var(--green-dark)!important; }
    .dataset-toolbar,.code-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .dataset-toolbar span,.code-toolbar span { color:var(--muted); font-size:11px; }
    .small-button,.action-button { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--white); color:var(--green-dark); cursor:pointer; font-size:11px; font-weight:700; }
    .small-button:hover,.action-button:hover { border-color:#aabbb0; }
    .table-scroll { overflow:auto; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; min-width:570px; border-collapse:collapse; font-size:11px; }
    th,td { padding:8px 10px; border-bottom:1px solid #eeeee8; text-align:left; white-space:nowrap; }
    th { background:#f2f3ee; color:#4e5b54; font-weight:750; }
    tr:last-child td { border-bottom:0; }
    .requirements { margin-bottom:10px; padding:10px 12px; border-radius:8px; background:#f2f3ee; color:#56625b; font:11px/1.6 Consolas,"Courier New",monospace; overflow-wrap:anywhere; }
    pre { max-height:570px; margin:0; padding:17px; overflow:auto; border-radius:9px; background:#202a28; color:#edf1eb; font:12px/1.65 Consolas,"Courier New",monospace; tab-size:4; }
    code { font-family:Consolas,"Courier New",monospace; }
    .walkthrough { display:grid; gap:8px; margin:0; padding:0; list-style:none; counter-reset:lesson; }
    .walkthrough li { position:relative; min-height:36px; padding:8px 10px 8px 39px; border-radius:8px; background:#f2f3ee; color:#56625b; font-size:12px; counter-increment:lesson; }
    .walkthrough li::before { position:absolute; left:10px; top:7px; display:grid; place-items:center; width:21px; height:21px; border-radius:50%; background:var(--green-pale); color:var(--green-dark); content:counter(lesson); font-size:10px; font-weight:800; }
    .visual { padding:15px; border:1px solid var(--line); border-radius:10px; background:#fbfbf7; }
    .visual svg { display:block; width:100%; height:auto; max-height:260px; }
    .visual-caption { margin:10px 0 0!important; font-size:11px!important; }
    .takeaway { padding:14px; border:1px solid #e8d8c2; border-radius:9px; background:var(--amber-pale); color:#685b4c!important; }
    .error-state { padding:50px 0; }
    .error-state h1 { font-size:32px; }
    .error-state p { color:var(--muted); }
    .footer { padding:24px 0 35px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    @media (max-width:760px) {
      .lesson-grid { grid-template-columns:1fr; gap:13px; }
      .toc { position:static; display:flex; flex-wrap:wrap; gap:4px 13px; align-items:center; }
      .toc strong { width:100%; }
      .toc a { padding:2px 0; }
    }
    @media (max-width:520px) {
      .wrap { width:calc(100% - 28px); }
      .lesson-hero { padding-top:36px; }
      .lesson-section { padding:16px; }
      .dataset-toolbar,.code-toolbar { align-items:flex-start; flex-direction:column; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">f(x)</span> ML FIELD GUIDE</a>
      <a class="back-link" href="index.html#topic-library">← All lessons</a>
    </div>
  </header>
  <main class="wrap">
    <div id="lesson"></div>
  </main>
  <footer class="footer"><div class="wrap">ML Field Guide · Examples are for learning; validate decisions on data appropriate to your project.</div></footer>
  <script type="module" src="./topic-page.js"></script>
</body>
</html>
